plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def buildInfo = new Date().format('yy.MM.dd_HH.mm')
boolean devBuild = false

version = project.mod_version
group = project.maven_group

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

base {
    archivesName = project.archives_base_name

    if (devBuild) {
        version = project.mod_version + "TEST_BUILD-${buildInfo.toString()}"
    } else {
        version = project.mod_version + project.version_details
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.kosmx.dev/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://api.modrinth.com/maven/" }
}
dependencies {
    modImplementation ("com.terraformersmc:modmenu:${modmenu_version}")
    modImplementation ("software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}")
    modImplementation include ("dev.kosmx.player-anim:player-animation-lib-fabric:${player_anim}")
    modImplementation "curse.maven:jade-324717:6494189"
    implementation("com.openai:openai-java:2.11.0")
    implementation ("com.google.code.gson:gson:2.9.0")
    minecraft ("com.mojang:minecraft:${minecraft_version}")
    mappings ("net.fabricmc:yarn:${yarn_mappings}:v2")
    modImplementation ("net.fabricmc:fabric-loader:${loader_version}")
    modImplementation ("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}